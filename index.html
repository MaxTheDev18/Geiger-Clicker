<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOC Clicker - Geiger Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #1a1c2a;
            --bg-card-hover: #24273a;
            --accent-green: #89fc00;
            --accent-cyan: #74c7ec;
            --accent-purple: #cba6f7;
            --accent-red: #f38ba8;
            --text-main: #cdd6f4;
            --text-muted: #a6adc8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-stat {
            display: flex;
            flex-direction: column;
        }

        .header-stat .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stat .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--bg-dark);
            background: var(--accent-green);
        }

        .tab-content {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tab-content.active {
            display: block;
        }

        /* Clicker Area */
        .clicker-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 20px;
        }

        .big-click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2d42 0%, #151722 100%);
            border: 4px solid var(--accent-green);
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(137, 252, 0, 0.2);
            transition: transform 0.05s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .big-click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(137, 252, 0, 0.4);
        }

        /* Upgrades List */
        .upgrades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .upgrade-card {
            background: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-card h4 {
            color: var(--accent-cyan);
        }

        .upgrade-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-green {
            background: var(--accent-green);
        }

        .btn-xs {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: var(--accent-purple);
            color: var(--bg-dark);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Leaderboard Styling */
        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-status {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card-hover);
            border-radius: 8px;
            border-left: 4px solid var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .leaderboard-rank {
            color: var(--accent-purple);
            font-weight: bold;
            width: 40px;
        }

        .leaderboard-score {
            color: var(--accent-green);
            font-weight: bold;
        }

        .you-badge {
            background: rgba(137, 252, 0, 0.2);
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        /* Floating Text */
        .floating-text {
            position: fixed;
            pointer-events: none;
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            animation: floatUp 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-stat">
                <span class="label">Lines of Code (LOC)</span>
                <span class="value" id="loc-display">0</span>
            </div>
            <div class="header-stat">
                <span class="label">LOC per Second</span>
                <span class="value" style="color: var(--accent-cyan);" id="cps-display">0.0</span>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" id="btn-tab-clicker" onclick="switchTab('clicker')">💻 Clicker</button>
            <button class="tab-btn" id="btn-tab-upgrades" onclick="switchTab('upgrades')">⚡ Upgrades</button>
            <button class="tab-btn" id="btn-tab-leaderboard" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
            <button class="tab-btn" id="btn-tab-settings" onclick="switchTab('settings')">⚙️ Settings</button>
        </nav>

        <!-- CLICKER TAB -->
        <div id="clicker" class="tab-content active">
            <div class="clicker-box">
                <button class="big-click-btn" id="click-btn" onclick="handleClick(event)">COMPILE()</button>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Click to write lines of code!</p>
            </div>
        </div>

        <!-- UPGRADES TAB -->
        <div id="upgrades" class="tab-content">
            <h3 style="margin-bottom: 15px;">Developer Upgrades</h3>
            <div class="upgrades-grid" id="upgrades-container"></div>
        </div>

        <!-- LEADERBOARD TAB -->
        <div id="leaderboard" class="tab-content">
            <div class="lb-header">
                <div>
                    <h3>Global Leaderboard</h3>
                    <div class="user-status">Rank: <b id="user-rank-display" style="color: var(--accent-purple);">Loading...</b> | Status: <span id="leaderboard-status">Initializing</span></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-green" onclick="syncToGlobalLeaderboard()">Sync High Score</button>
                    <button class="btn" onclick="loadGlobalLeaderboard()">Refresh Ranks</button>
                </div>
            </div>
            <div class="leaderboard-list" id="leaderboard-list">
                <div style="color: var(--text-muted); font-style: italic; text-align: center; padding: 20px 0;">Loading ranks...</div>
            </div>
        </div>

        <!-- SETTINGS TAB -->
        <div id="settings" class="tab-content">
            <h3>Player Profile & Settings</h3>
            <div style="margin-top: 15px;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-muted);">Change Username:</label>
                <div class="input-group">
                    <input type="text" id="username-input" placeholder="Enter username...">
                    <button class="btn" onclick="updateUsername()">Save Username</button>
                </div>
            </div>
            <hr style="border-color: var(--border-color); margin: 20px 0;">
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background: var(--accent-red); color: #fff;" onclick="resetGame()">Reset Local Game</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const DREAMLO_PUBLIC = "66b027268f40bb1108575f63";
        // Public/Private endpoints
        const DREAMLO_HTTPS_BASE = "https://www.dreamlo.com/lb/";

        // --- GAME STATE ---
        let state = {
            username: localStorage.getItem("clicker_user") || "Coder_" + Math.floor(1000 + Math.random() * 9000),
            loc: 0,
            totalLoc: 0,
            clicks: 0,
            cps: 0,
            clickPower: 1,
            upgrades: {
                autoClicker: 0,
                scriptKid: 0,
                juniorDev: 0,
                aiAssistant: 0,
                serverFarm: 0,
                quantumRig: 0
            }
        };

        const UPGRADE_DATA = {
            autoClicker: { name: "Auto Clicker", baseCost: 15, cps: 0.5, desc: "Automatically clicks once every 2 seconds." },
            scriptKid: { name: "Script Kiddie", baseCost: 100, cps: 4, desc: "Copies StackOverflow answers." },
            juniorDev: { name: "Junior Developer", baseCost: 1100, cps: 32, desc: "Writes code for coffee." },
            aiAssistant: { name: "AI Copilot", baseCost: 12000, cps: 260, desc: "Generates boilerplate instantly." },
            serverFarm: { name: "Server Farm", baseCost: 130000, cps: 1400, desc: "Runs parallel compilation threads." },
            quantumRig: { name: "Quantum Rig", baseCost: 1400000, cps: 7800, desc: "Computes all possible code states." }
        };

        // --- INITIALIZATION ---
        window.addEventListener("DOMContentLoaded", () => {
            loadLocalSave();
            document.getElementById("username-input").value = state.username;
            renderUpgrades();
            recalcCPS();
            updateUI();
            
            // Game loop tick every 100ms
            let lastTick = Date.now();
            setInterval(() => {
                const now = Date.now();
                const delta = (now - lastTick) / 1000;
                lastTick = now;

                if (state.cps > 0) {
                    const gain = state.cps * delta;
                    state.loc += gain;
                    state.totalLoc += gain;
                    updateUI();
                }
            }, 100);

            // Auto-save local every 10s
            setInterval(saveLocal, 10000);
        });

        // --- UTILITIES ---
        function formatNum(num) {
            if (isNaN(num) || num === null) return "0";
            if (num >= 1e12) return (num / 1e12).toFixed(2) + " T";
            if (num >= 1e9) return (num / 1e9).toFixed(2) + " B";
            if (num >= 1e6) return (num / 1e6).toFixed(2) + " M";
            if (num >= 1e3) return (num / 1e3).toFixed(2) + " K";
            return Math.floor(num).toLocaleString();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-tab-' + tabId).classList.add('active');

            if (tabId === 'leaderboard') {
                loadGlobalLeaderboard();
            }
        }

        // --- CORE GAMEPLAY ---
        function handleClick(e) {
            state.loc += state.clickPower;
            state.totalLoc += state.clickPower;
            state.clicks++;
            
            spawnFloatingText(e, `+${state.clickPower} LOC`);
            updateUI();
        }

        function spawnFloatingText(e, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);
            
            el.style.left = `${x - 10}px`;
            el.style.top = `${y - 20}px`;
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function recalcCPS() {
            let totalCps = 0;
            Object.keys(UPGRADE_DATA).forEach(key => {
                totalCps += (state.upgrades[key] || 0) * UPGRADE_DATA[key].cps;
            });
            state.cps = totalCps;
        }

        function getUpgradeCost(key) {
            const base = UPGRADE_DATA[key].baseCost;
            const count = state.upgrades[key] || 0;
            return Math.floor(base * Math.pow(1.15, count));
        }

        function buyUpgrade(key) {
            const cost = getUpgradeCost(key);
            if (state.loc >= cost) {
                state.loc -= cost;
                state.upgrades[key] = (state.upgrades[key] || 0) + 1;
                recalcCPS();
                renderUpgrades();
                updateUI();
                saveLocal();
            }
        }

        function renderUpgrades() {
            const container = document.getElementById("upgrades-container");
            container.innerHTML = "";

            Object.keys(UPGRADE_DATA).forEach(key => {
                const item = UPGRADE_DATA[key];
                const count = state.upgrades[key] || 0;
                const cost = getUpgradeCost(key);

                const card = document.createElement("div");
                card.className = "upgrade-card";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4>${item.name}</h4>
                        <span style="font-weight:bold; color:var(--accent-purple);">x${count}</span>
                    </div>
                    <p>${item.desc}</p>
                    <div style="font-size:0.8rem; color:var(--accent-cyan);">+${item.cps} CPS each</div>
                    <button class="btn ${state.loc >= cost ? 'btn-green' : ''}" onclick="buyUpgrade('${key}')">
                        Buy (${formatNum(cost)} LOC)
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function updateUI() {
            document.getElementById("loc-display").textContent = formatNum(state.loc);
            document.getElementById("cps-display").textContent = state.cps.toFixed(1);
        }

        // --- LOCAL STORAGE ---
        function saveLocal() {
            localStorage.setItem("clicker_state", JSON.stringify(state));
        }

        function loadLocalSave() {
            const saved = localStorage.getItem("clicker_state");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Save load error", e); }
            }
        }

        function resetGame() {
            if (confirm("Reset all local progress?")) {
                localStorage.removeItem("clicker_state");
                location.reload();
            }
        }

        function updateUsername() {
            const val = document.getElementById("username-input").value.trim();
            if (val) {
                state.username = val;
                localStorage.setItem("clicker_user", val);
                saveLocal();
                alert("Username updated to: " + val);
            }
        }

        // --- PACKING GAME STATE FOR CLOUD BACKUP ---
        function packGameState() {
            const minState = { l: Math.floor(state.loc), tl: Math.floor(state.totalLoc), c: state.clicks, u: state.upgrades };
            return btoa(JSON.stringify(minState));
        }

        function unpackGameState(base64Str) {
            try {
                const data = JSON.parse(atob(base64Str));
                state.loc = data.l || 0;
                state.totalLoc = data.tl || 0;
                state.clicks = data.c || 0;
                if (data.u) state.upgrades = { ...state.upgrades, ...data.u };
                recalcCPS();
                renderUpgrades();
                updateUI();
                saveLocal();
                return true;
            } catch (e) {
                return false;
            }
        }

        window.cloudLoadFromEntry = function(base64Data) {
            if (confirm("Overwrite current save with this cloud save?")) {
                if (unpackGameState(base64Data)) alert("Cloud state loaded successfully!");
                else alert("Failed to unpack save data.");
            }
        };

        // --- ULTRA-RELIABLE LEADERBOARD SYSTEM ---
        
        // Dynamic fetcher that cycles direct HTTPS, JSONP, and proxies
        async function fetchLeaderboardData() {
            const publicCode = DREAMLO_PUBLIC;
            const cbTime = Date.now();

            // Method 1: Direct HTTPS Fetch
            try {
                const res = await fetch(`${DREAMLO_HTTPS_BASE}${publicCode}/json?_cb=${cbTime}`, { cache: "no-store" });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.dreamlo) return data.dreamlo.leaderboard;
                }
            } catch (e) {
                console.warn("Direct HTTPS fetch failed, falling back to JSONP...", e);
            }

            // Method 2: JSONP Script Injection (Completely immune to CORS & AdBlock domain filters)
            try {
                const jsonpData = await new Promise((resolve, reject) => {
                    const callbackName = 'dreamloCb_' + Math.random().toString(36).substring(2, 9);
                    const script = document.createElement('script');

                    const timeout = setTimeout(() => {
                        cleanup();
                        reject(new Error("JSONP Timeout"));
                    }, 6000);

                    function cleanup() {
                        clearTimeout(timeout);
                        if (script.parentNode) script.parentNode.removeChild(script);
                        delete window[callbackName];
                        delete window.dreamloDataCallback;
                    }

                    window[callbackName] = window.dreamloDataCallback = function(data) {
                        cleanup();
                        resolve(data);
                    };

                    script.src = `${DREAMLO_HTTPS_BASE}${publicCode}/json-in-script?callback=${callbackName}&_cb=${cbTime}`;
                    script.onerror = () => { cleanup(); reject(new Error("JSONP Script Load Error")); };
                    document.body.appendChild(script);
                });

                if (jsonpData && jsonpData.dreamlo) {
                    return jsonpData.dreamlo.leaderboard;
                }
            } catch (e) {
                console.warn("JSONP fetch failed, trying CORS proxies...", e);
            }

            // Method 3: CORS Proxy Fallbacks
            const proxyUrls = [
                `https://corsproxy.io/?https://www.dreamlo.com/lb/${publicCode}/json?_cb=${cbTime}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://www.dreamlo.com/lb/${publicCode}/json?_cb=${cbTime}`)}`
            ];

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetch(pUrl);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.dreamlo) return data.dreamlo.leaderboard;
                    }
                } catch (err) { /* ignore and try next */ }
            }

            throw new Error("All leaderboard fetch channels failed.");
        }

        async function loadGlobalLeaderboard() {
            const listEl = document.getElementById("leaderboard-list");
            const rankDisplay = document.getElementById("user-rank-display");
            const statusEl = document.getElementById("leaderboard-status");

            if (!listEl) return;
            listEl.innerHTML = `<div style="color: var(--text-muted); font-style: italic; text-align: center; padding: 20px 0;">Loading ranks...</div>`;
            if (statusEl) statusEl.textContent = "Connecting...";

            try {
                const leaderboard = await fetchLeaderboardData();

                if (!leaderboard || !leaderboard.entry) {
                    listEl.innerHTML = `<div style="color: var(--text-muted); font-style: italic; text-align: center; padding: 20px 0;">No high scores recorded yet! Sync yours first!</div>`;
                    if (rankDisplay) rankDisplay.textContent = "Unranked";
                    if (statusEl) statusEl.textContent = "Online (0 entries)";
                    return;
                }

                let entries = leaderboard.entry;
                if (!Array.isArray(entries)) entries = [entries];

                let userRank = "Unranked";
                if (state.username) {
                    const foundIdx = entries.findIndex(e => e.name && e.name.toLowerCase() === state.username.toLowerCase());
                    if (foundIdx !== -1) userRank = `#${foundIdx + 1}`;
                }
                if (rankDisplay) rankDisplay.textContent = userRank;

                listEl.innerHTML = "";
                entries.slice(0, 15).forEach((entry, idx) => {
                    const row = document.createElement("div");
                    row.className = "leaderboard-row";
                    const isCurrentUser = state.username && (entry.name && entry.name.toLowerCase() === state.username.toLowerCase());
                    const nameStyle = isCurrentUser ? "color: var(--accent-green); font-weight: bold;" : "";
                    const safeName = escapeHTML(entry.name || 'Anonymous');
                    const safeScore = formatNum(parseInt(entry.score || 0));

                    row.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="leaderboard-rank">#${idx + 1}</span>
                            <span style="${nameStyle}">${safeName} ${isCurrentUser ? '<span class="you-badge">You</span>' : ''}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="leaderboard-score">${safeScore} LOC</span>
                            ${entry.text ? `<button class="btn-xs" onclick="cloudLoadFromEntry('${entry.text}')" title="Restore save file from cloud">Load Save</button>` : ''}
                        </div>
                    `;
                    listEl.appendChild(row);
                });

                if (statusEl) statusEl.textContent = `Connected (${entries.length} scores)`;
            } catch (err) {
                console.error("Leaderboard Error:", err);
                listEl.innerHTML = `
                    <div style="color: var(--accent-red); text-align: center; padding: 15px; background: rgba(243,139,168,0.1); border-radius: 8px;">
                        ❌ <b>Failed to fetch ranks.</b><br>
                        <small style="color: var(--text-muted); display: block; margin-top: 5px;">
                            Unable to establish connection to leaderboard API. Please click "Refresh Ranks".
                        </small>
                    </div>`;
                if (statusEl) statusEl.textContent = "Error";
            }
        }

        async function saveGlobalScore(score, textData = "") {
            if (!state.username || state.username.trim() === "") return;
            
            const cleanUser = encodeURIComponent(state.username.trim());
            const cleanScore = Math.floor(score);
            const cleanText = encodeURIComponent(textData);
            
            // Dreamlo add-pipe endpoint URL
            const url = `${DREAMLO_HTTPS_BASE}${DREAMLO_PUBLIC}/add-pipe/${cleanUser}/${cleanScore}/0/${cleanText}`;
            
            // Send request without CORS restriction issues
            try {
                await fetch(url, { mode: 'no-cors', cache: 'no-store' });
            } catch (e) {}

            // Image beacon fallback guarantees request reaches server even on local files
            const img = new Image();
            img.src = url + `?_cb=${Date.now()}`;
        }

        async function syncToGlobalLeaderboard() {
            const statusEl = document.getElementById("leaderboard-status");
            if (statusEl) statusEl.textContent = "Syncing high score...";
            
            const packedState = packGameState();
            await saveGlobalScore(state.loc, packedState);
            
            setTimeout(() => {
                loadGlobalLeaderboard();
            }, 1200);
        }
    </script>
</body>
</html>
